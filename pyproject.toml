[project]
name = "discord-bot"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiocron==2.1",
    "apscheduler==3.11.3",
    "bidict==0.24.1",
    "cryptography==50.0.2",
    "dateparser==1.5.0",
    "discord.py==2.7.1",
    "emoji==2.16.0",
    "expiringdict==1.2.2",
    "gino==1.0.1",
    "gitpython==3.2.1",
    "inflect==7.6.0",
    "irc==20.5.0",
    "munch==4.0.0",
    "pyyaml==6.0.3",
    "setuptools==80.9.0", # Added so gino/asyncpg/sqlalchemy doesn't break.
    "unidecode==1.4.0",
]

[project.optional-dependencies]
dev = [
    "black==26.10.1",
    "flake8==7.5.0",
    "flake8-annotations==3.3.1",
    "flake8-bugbear==26.10.27",
    "flake8-docstrings-complete==1.4.1",
    "flake8-modern-annotations==1.6.0",
    "flake8-variables-names==0.0.6",
    "hypothesis==6.170.15",
    "isort==9.0.2",
    "pydoclint==0.12.0",
    "pylint==4.1.3",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1"
]

[tool.pytest.ini_options]
testpaths = ["./tests"]
